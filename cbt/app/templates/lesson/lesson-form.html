{% extends 'base.html' %}

{% block header %}
<div class="page-header">
    <h1 class="page-title">{{title}}</h1>
    <div>
        <ol class="breadcrumb1">
            <li class="breadcrumb-item1"><a href="{{url_for('index')}}">Beranda</a></li>
            <li class="breadcrumb-item1" aria-current="page"><a href="{{url_for('lesson.show')}}">Pelajaran</a></li>
            <li class="breadcrumb-item1 active" aria-current="page">{{title}}</li>
        </ol>
    </div>
</div>
{% endblock header %}

{% block content %}
<!-- Row -->
<div class="row row-sm">
    <div class="col-lg-6 m-auto">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <input type="hidden" name="id" value="{{id}}"/>
                    <div class="form-group">
                        <label for="inputCode" class="form-label">Kode Pelajaran</label>
                        <input name="kode" type="text" class="form-control" id="inputCode" value="{{form.kode}}">
                    </div>
                    <div class="form-group">
                        <label for="inputName" class="form-label">Nama Pelajaran</label>
                        <input name="nama" type="text" class="form-control" id="inputName" value="{{form.nama}}">
                    </div>
                    <button class="btn btn-primary mt-4 mb-0">Simpan</button>
                </form>
            </div>
        </div>
    </div>
</div>
<!-- End Row -->
{% endblock content %}
