{% extends 'base.html' %}

{% block header %}
<div class="page-header">
    <h1 class="page-title">{{title}}</h1>
    <div>
        <ol class="breadcrumb1">
            <li class="breadcrumb-item1"><a href="{{url_for('index')}}">Beranda</a></li>
            <li class="breadcrumb-item1" aria-current="page"><a href="{{url_for('lesson.show', lesson_id=lesson.id)}}">Pelajaran</a></li>
            <li class="breadcrumb-item1 active" aria-current="page"><a href="{{url_for('lesson.question.show', lesson_id=lesson.id)}}">{{lesson.kode}}</a></li>
            <li class="breadcrumb-item1 active" aria-current="page">{{title}}</li>
        </ol>
    </div>
</div>
{% endblock header %}

{% block content %}
<!-- Row -->
<div class="row row-sm">
    <div class="col-lg-6 m-auto">
        <div class="card">
            <div class="card-body">
                <span>template file yang dapat digunakan: <a href="{{url_for('static', filename='template/template-pertanyaan.csv')}}">template pertanyaan</a></span>
                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <input type="hidden" name="id" value="{{id}}"/>
                    <div class="form-group">
                        <label for="input-username" class="form-label">Pilih File</label>
                        <input name="file" class="form-control" type="file">
                    </div>
                    <div class="form-group">
                        <label for="input-answer" class="form-label">Pemisah</label>
                        <select name="pemisah" id="input-answer" class="form-control form-select" data-bs-placeholder="Select Country">
                            <option value=";" >;</option>
                            <option value="," >,</option>
                        </select>
                    </div>
                    <button class="btn btn-primary mt-4 mb-0">Simpan</button>
                </form>
            </div>
        </div>
    </div>
</div>
<!-- End Row -->
{% endblock content %}
